[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─────────────────────────────────────────────
;  PHP-FPM
; ─────────────────────────────────────────────
[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

; ─────────────────────────────────────────────
;  Queue: notifications.transactional
;  High-priority, more workers, short timeout
; ─────────────────────────────────────────────
[program:worker-transactional]
command=php /var/www/notifier-app/artisan queue:work rabbitmq
    --queue=notifications.transactional
    --sleep=3
    --tries=3
    --timeout=60
    --max-jobs=500
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=3
autostart=true
autorestart=true
stopwaitsecs=70
stdout_logfile=/var/log/supervisor/worker-transactional.log
stderr_logfile=/var/log/supervisor/worker-transactional-error.log

; ─────────────────────────────────────────────
;  Queue: notifications.critical
;  Highest priority, dedicated workers, strict timeout
; ─────────────────────────────────────────────
[program:worker-critical]
command=php /var/www/notifier-app/artisan queue:work rabbitmq
    --queue=notifications.critical
    --sleep=1
    --tries=5
    --timeout=30
    --max-jobs=500
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=40
stdout_logfile=/var/log/supervisor/worker-critical.log
stderr_logfile=/var/log/supervisor/worker-critical-error.log

; ─────────────────────────────────────────────
;  Queue: notifications.marketing
;  Lower priority, fewer workers, longer timeout
; ─────────────────────────────────────────────
[program:worker-marketing]
command=php /var/www/notifier-app/artisan queue:work rabbitmq
    --queue=notifications.marketing
    --sleep=5
    --tries=2
    --timeout=120
    --max-jobs=200
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=130
stdout_logfile=/var/log/supervisor/worker-marketing.log
stderr_logfile=/var/log/supervisor/worker-marketing-error.log

; ─────────────────────────────────────────────
;  Laravel Scheduler (every minute)
; ─────────────────────────────────────────────
[program:scheduler]
command=bash -c "while true; do php /var/www/notifier-app/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler-error.log
